name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Arch has the GTK 4.22 / Libadwaita 1.9 the settings app needs.
    container: archlinux:latest
    env:
      # The headless mutter puts its Wayland socket there.
      XDG_RUNTIME_DIR: /tmp/runtime
    steps:
      - name: Install packages
        run: |
          mkdir -m 700 -p "$XDG_RUNTIME_DIR"
          pacman -Syu --noconfirm --needed \
            git python python-gobject python-cairo python-dbus python-pillow python-libevdev \
            gtk4 libadwaita gjs mutter dbus \
            adwaita-icon-theme adwaita-fonts noto-fonts

      - uses: actions/checkout@v7

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Syntax checks
        run: |
          python3 -c "import ast; ast.parse(open('dialpad.py').read())"
          python3 -m compileall -q config config_app desktop overlay tools dialpad_dbus.py
          bash -n install*.sh uninstall.sh

      # The settings pictures show the apps installed on the desktop that
      # rendered them, so only the overlay pictures are compared here.
      - name: README pictures
        run: python3 tools/update_previews.py --check --only overlay --output rendered

      - name: Keep the rendered pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-pictures
          path: rendered/
          if-no-files-found: ignore

  # Builds the Arch package from this commit, installs it in a clean
  # container, checks files and imports and removes it again.
  arch-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build, install and remove the package
        run: bash packaging/arch/test-package.sh "$GITHUB_WORKSPACE"

  # The .deb from this commit, built, installed with apt (dependencies from
  # the distribution), checked and removed in a clean container.
  deb-package:
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:latest", "ubuntu:24.04", "debian:trixie"]
    name: .deb on ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ${{ matrix.image }}
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build, install and remove the package
        run: bash packaging/deb/test-package.sh "$GITHUB_WORKSPACE"

  # The .rpm from this commit, the same way with dnf.
  rpm-package:
    name: .rpm on fedora:latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: fedora:latest
    steps:
      - name: Install git
        run: dnf -y -q install git

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build, install and remove the package
        run: bash packaging/rpm/test-package.sh "$GITHUB_WORKSPACE"

  # install.sh and uninstall.sh on other distributions, in clean containers
  # (tests/install_in_container.sh; no DialPad there, so INSTALL_IN_CONTAINER).
  install:
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:latest", "ubuntu:latest", "ubuntu:24.04"]
    name: install.sh on ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Install, check and uninstall
        run: bash tests/install_in_container.sh "$GITHUB_WORKSPACE"

  # The layer-shell dial (overlay/layer_shell.py) on headless sway with a
  # fake driver: screenshots compared with dial.js, click-through, keyboard
  # focus, hiding, pill and fade (tests/layer_shell_in_container.sh), at
  # output scale 1 and 2 (HiDPI).
  layer-shell-dial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7

      - name: sway, scale 1
        run: bash tests/layer_shell_in_container.sh "$GITHUB_WORKSPACE" sway /tmp/ls/sway-1

      - name: sway, scale 2
        if: success() || failure()
        env:
          TURNPAD_SKIP_PACKAGES: "1"
        run: bash tests/layer_shell_in_container.sh "$GITHUB_WORKSPACE" sway /tmp/ls/sway-2 2

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layer-shell-dial
          path: /tmp/ls/
          if-no-files-found: ignore
